[project]
name = "trial-conversion-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sri Bandhakavi", email = "sricharan.bandhakavi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.0.53",
    "xgboost>=3.2.0",
]

[project.scripts]
trial-conversion-model = "trial_conversion_model:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
